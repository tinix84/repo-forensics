# AI / ML signatures. Fields:
#   id, library, category, subcategory, primitive: canonical abstraction
#   modules: import/call qualified-name prefixes that identify the library
#   distributions: package names as declared in manifests
#   refine: call-name prefix -> more specific primitive (optional)
- id: openai
  library: openai
  category: ai
  subcategory: llm-provider-api
  primitive: hosted-llm-inference
  modules: [openai]
  distributions: [openai]
- id: anthropic
  library: anthropic
  category: ai
  subcategory: llm-provider-api
  primitive: hosted-llm-inference
  modules: [anthropic]
  distributions: [anthropic]
