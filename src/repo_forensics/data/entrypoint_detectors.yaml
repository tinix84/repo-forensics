# Entry-point detectors: call or decorator qualified-name prefix -> entry type.
# status: CONFIRMED when the construct unambiguously defines an entry point,
#         SUPPORTED when it strongly suggests one.
- match: fastapi.FastAPI
  type: http
  status: CONFIRMED
- match: flask.Flask
  type: http
  status: CONFIRMED
- match: starlette.applications.Starlette
  type: http
  status: CONFIRMED
- match: litestar.Litestar
  type: http
  status: CONFIRMED
- match: sanic.Sanic
  type: http
  status: CONFIRMED
- match: aiohttp.web.Application
  type: http
  status: CONFIRMED
- match: quart.Quart
  type: http
  status: CONFIRMED
- match: django.core.wsgi.get_wsgi_application
  type: http
  status: CONFIRMED
- match: django.core.asgi.get_asgi_application
  type: http
  status: CONFIRMED
- match: celery.Celery
  type: worker
  status: CONFIRMED
- match: dramatiq.actor
  type: worker
  status: CONFIRMED
- match: typer.Typer
  type: cli
  status: CONFIRMED
- match: click.command
  type: cli
  status: CONFIRMED
- match: click.group
  type: cli
  status: CONFIRMED
- match: argparse.ArgumentParser
  type: cli
  status: SUPPORTED
- match: fire.Fire
  type: cli
  status: CONFIRMED
- match: streamlit
  type: ui
  status: SUPPORTED
- match: gradio.Interface
  type: ui
  status: CONFIRMED
- match: gradio.Blocks
  type: ui
  status: CONFIRMED
- match: mcp.server.fastmcp.FastMCP
  type: mcp-server
  status: CONFIRMED
- match: fastmcp.FastMCP
  type: mcp-server
  status: CONFIRMED
- match: apscheduler
  type: scheduled-job
  status: SUPPORTED
- match: schedule.every
  type: scheduled-job
  status: SUPPORTED
